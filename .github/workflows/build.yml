name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK + NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;29.0.14206865"

      # Kode hasil recompile (gen/). Salah satu dari tiga:
      #  1. folder gen/ sudah ada di repo (private), atau
      #  2. gen.zip di root repo (isinya folder gen/), atau
      #  3. folder GAME/ (exe + dll) -> dibuat ulang pakai tools/regen_gen.sh (berjam-jam)
      - name: Siapkan gen/
        run: |
          if [ -d gen ]; then
            echo "pakai gen/ yang sudah ada"
          elif [ -f gen.zip ]; then
            unzip -q gen.zip
          elif [ -d GAME ]; then
            pip install capstone==5.0.9 pefile==2024.8.26 pillow
            chmod +x tools/regen_gen.sh
            tools/regen_gen.sh GAME
          else
            echo "::error::Tidak ada gen/, gen.zip, atau GAME/ di repo"; exit 1
          fi
          ls gen | head -5; ls gen | wc -l

      - name: Icon (opsional)
        if: hashFiles('GAME/LEGOMARVEL.exe') != ''
        run: |
          pip install pefile pillow
          python3 tools/make_icon.py GAME/LEGOMARVEL.exe

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PndkVersion=29.0.14206865 --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LegoMarvel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
